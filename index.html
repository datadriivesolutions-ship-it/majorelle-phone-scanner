<!doctype html>
<html lang="fr">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Majorelle · Scanner téléphone</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#0f172a;font:15px Arial,sans-serif}
    .wrap{max-width:620px;margin:20px auto;padding:18px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:18px;box-shadow:0 8px 30px #0f172a12}
    h1{font-size:21px;margin:0 0 5px}.muted{color:#64748b;font-size:13px;line-height:1.5}
    .view{position:relative;background:#0f172a;border-radius:16px;overflow:hidden;margin:16px 0;min-height:280px;display:grid;place-items:center}
    video{width:100%;max-height:65vh;object-fit:cover;display:block}.frame{position:absolute;inset:15%;border:2px solid #38bdf8;border-radius:14px;pointer-events:none}
    .status{padding:11px;background:#eff6ff;color:#1e40af;border-radius:11px;font-size:13px;line-height:1.5}
    button{border:0;border-radius:11px;padding:13px 17px;background:#0c1b3a;color:#fff;font-weight:700;font-size:14px;width:100%;margin-top:10px}
    button.secondary{background:#e2e8f0;color:#1e293b}
    input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;margin-top:12px}
    @media(max-width:520px){.wrap{margin:0;padding:10px}.card{padding:14px;border-radius:14px}}
  </style>
</head>
<body>
<div class="wrap"><div class="card">
  <h1>Majorelle · Scanner téléphone</h1>
  <div class="muted">Pointez la caméra vers le code-barres du produit. Le résultat sera envoyé à votre PC.</div>
  <div class="view"><video id="video" autoplay muted playsinline></video><div class="frame"></div></div>
  <div id="status" class="status">Initialisation de la caméra…</div>
  <button id="retry">Activer / Réessayer la caméra</button>
  <button id="close" class="secondary">Fermer</button>
  <div class="muted" style="margin-top:14px">Si la lecture automatique n’est pas disponible, vous pouvez saisir le code manuellement :</div>
  <input id="manual" inputmode="numeric" autocomplete="off" placeholder="Code-barres">
  <button id="sendManual">Envoyer le code au PC</button>
</div></div>
<script>
(function(){
  const token='<?= phoneToken ?>';
  const video=document.getElementById('video'),status=document.getElementById('status');
  let stream=null,detector=null,frame=0,busy=false,sent=false;
  function stop(){if(frame)cancelAnimationFrame(frame);frame=0;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}try{video.pause();video.srcObject=null}catch(e){}}
  function send(code){
    code=String(code||'').trim();if(!code||sent)return;
    sent=true;stop();status.textContent='Envoi du code vers votre PC…';
    google.script.run.withSuccessHandler(()=>{status.textContent='Code envoyé avec succès. Vous pouvez fermer cette page.';})
      .withFailureHandler(err=>{sent=false;status.textContent=(err&&err.message)||'Erreur lors de l’envoi. Réessayez.';})
      .submitPhoneScan(token,code);
  }
  async function start(){
    stop();sent=false;
    if(!/^[a-f0-9]{64}$/i.test(token)){status.textContent='Lien de connexion invalide. Recommencez depuis le PC.';return}
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){status.textContent='Caméra indisponible. Ouvrez ce lien dans Chrome ou Safari et vérifiez HTTPS.';return}
    try{
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false});
      video.srcObject=stream;await video.play();status.textContent='Caméra active. Recherche du code-barres…';
      if(!('BarcodeDetector' in window)){status.textContent='Caméra active, mais lecture automatique non prise en charge. Saisissez le code manuellement ci-dessous.';return}
      const supported=await BarcodeDetector.getSupportedFormats();
      const formats=['ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code'].filter(x=>supported.includes(x));
      if(!formats.length){status.textContent='Formats de codes non pris en charge. Saisissez le code manuellement.';return}
      detector=new BarcodeDetector({formats});
      async function tick(){
        if(!stream||sent)return;
        if(!busy&&video.readyState>=2){busy=true;try{const found=await detector.detect(video);if(found&&found[0]&&found[0].rawValue){send(found[0].rawValue);return}}catch(e){}finally{busy=false}}
        if(stream&&!sent)frame=requestAnimationFrame(tick);
      }
      frame=requestAnimationFrame(tick);
    }catch(err){status.textContent=(err&&err.name==='NotAllowedError'?'Autorisez l’accès à la caméra dans les paramètres du navigateur.':'Impossible d’activer la caméra : '+(err&&err.message||'erreur inconnue'))}
  }
  document.getElementById('retry').addEventListener('click',start);
  document.getElementById('close').addEventListener('click',()=>{stop();status.textContent='Scanner arrêté. Vous pouvez fermer cette page.'});
  document.getElementById('sendManual').addEventListener('click',()=>send(document.getElementById('manual').value));
  document.getElementById('manual').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();send(e.target.value)}});
  start();
})();
</script>
</body></html>
