
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1b3a">
<title>Majorelle · Phone Scanner</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef2f7;color:#111827;font:16px system-ui,-apple-system,Segoe UI,Arial,sans-serif}
.wrap{max-width:650px;margin:18px auto;padding:12px}
.card{background:#fff;border:1px solid #dbe2ea;border-radius:22px;padding:20px;box-shadow:0 8px 28px #0f172a10}
h1{font-size:24px;margin:0 0 8px}
.muted{color:#64748b;line-height:1.55}
.view{position:relative;background:#0c1b3a;border-radius:20px;overflow:hidden;margin:18px 0;min-height:300px;display:grid;place-items:center}
video{display:block;width:100%;max-height:62vh;object-fit:cover}
.frame{position:absolute;left:12%;right:12%;top:28%;bottom:28%;border:3px solid #38bdf8;border-radius:18px;pointer-events:none}
.status{background:#eff6ff;color:#1e40af;padding:14px;border-radius:14px;line-height:1.5}
button{width:100%;border:0;border-radius:14px;padding:16px;margin-top:12px;background:#0c1b3a;color:white;font-size:16px;font-weight:700}
button.secondary{background:#e2e8f0;color:#1e293b}
input{width:100%;padding:15px;border:1px solid #cbd5e1;border-radius:12px;font-size:18px;margin-top:12px}
@media(max-width:520px){.wrap{margin:0;padding:10px}.card{padding:16px;border-radius:16px}}
</style>
</head>
<body>
<div class="wrap"><main class="card">
<h1>Majorelle · Phone Scanner</h1>
<div class="muted">Point your phone camera at the product barcode. The result will be sent to your PC.</div>
<div class="view"><video id="video" autoplay muted playsinline></video><div class="frame"></div></div>
<div id="status" class="status">Preparing scanner…</div>
<button id="start">Start / Retry camera</button>
<button id="stop" class="secondary">Stop camera</button>
<div class="muted" style="margin-top:18px">If automatic scanning is unavailable, enter the barcode manually:</div>
<input id="manual" inputmode="numeric" autocomplete="off" placeholder="Barcode">
<button id="send">Send barcode to PC</button>
</main></div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>
<script src="https://unpkg.com/@zxing/browser@latest"></script>

<script>
(()=>{
'use strict';

const params=new URLSearchParams(location.search);
const endpoint=params.get('endpoint')||'';
const token=params.get('token')||'';

const video=document.getElementById('video');
const status=document.getElementById('status');

let stream=null;
let detector=null;
let raf=0;
let detectorBusy=false;
let sending=false;
let awaitingConfirmation=false;
let confirmationTimer=null;
let clearFrames=0;
let zxingControls=null;
let cameraActive=false;

let candidateCode='';
let candidateFormat='';
let candidateFrames=0;
let lastSentCode='';

let receiptTimer=null;
let receiptBusy=false;

const validEndpoint=/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(endpoint);
const validToken=/^[a-f0-9]{64}$/i.test(token);

function message(s){
 status.textContent=s;
}

function stop(){
 cameraActive=false;

 if(raf)cancelAnimationFrame(raf);
 raf=0;

 if(zxingControls){
  try{zxingControls.stop()}catch(e){}
  zxingControls=null;
 }

 if(receiptTimer)clearTimeout(receiptTimer);
 receiptTimer=null;
 if(confirmationTimer)clearTimeout(confirmationTimer);
 confirmationTimer=null;
 awaitingConfirmation=false;
 clearFrames=0;

 if(stream){
  stream.getTracks().forEach(t=>t.stop());
  stream=null;
 }

 try{
  video.pause();
  video.srcObject=null;
 }catch(e){}
}

function jsonp(action,extra={}){
 return new Promise((resolve,reject)=>{
  const cb='mjcb_'+Date.now()+'_'+Math.floor(Math.random()*1e6);
  const script=document.createElement('script');

  const q=new URLSearchParams({
   phoneApi:action,
   token,
   callback:cb,
   ...extra
  });

  const timer=setTimeout(
   ()=>finish(new Error('Request timed out')),
   12000
  );

  function finish(err,data){
   clearTimeout(timer);

   try{delete window[cb]}
   catch(e){window[cb]=undefined}

   script.remove();

   err?reject(err):resolve(data);
  }

  window[cb]=data=>finish(null,data);

  script.onerror=()=>finish(
   new Error('Could not contact Majorelle server')
  );

  script.src=endpoint+'?'+q.toString();
  document.head.appendChild(script);
 });
}

function validGtin(code,format){

 if(format==='ean_13'){
  if(!/^\d{13}$/.test(code))return false;

  const d=code.split('').map(Number);
  let sum=0;

  for(let i=0;i<12;i++){
   sum+=d[i]*(i%2?3:1);
  }

  return (10-sum%10)%10===d[12];
 }

 if(format==='ean_8'){
  if(!/^\d{8}$/.test(code))return false;

  const d=code.split('').map(Number);
  let sum=0;

  for(let i=0;i<7;i++){
   sum+=d[i]*(i%2?1:3);
  }

  return (10-sum%10)%10===d[7];
 }

 if(format==='upc_a'){
  if(!/^\d{12}$/.test(code))return false;

  const d=code.split('').map(Number);
  let sum=0;

  for(let i=0;i<11;i++){
   sum+=d[i]*(i%2?1:3);
  }

  return (10-sum%10)%10===d[11];
 }

 return true;
}

function candidateFrom(hits){

 const vw=video.videoWidth||1;
 const vh=video.videoHeight||1;

 const list=(hits||[]).filter(hit=>{

  const code=String(hit.rawValue||'').trim();
  const fmt=String(hit.format||'');

  if(!code)return false;

  if(['ean_13','ean_8','upc_a'].includes(fmt)&&!validGtin(code,fmt)){
   return false;
  }

  if(!['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf'].includes(fmt)){
   return false;
  }

  const box=hit.boundingBox;

  if(box){
   const cx=(box.x+box.width/2)/vw;
   const cy=(box.y+box.height/2)/vh;

   if(cx<0.06||cx>0.94||cy<0.08||cy>0.92)return false;

   if(box.width<box.height*1.15)return false;
  }

  return true;
 });

 list.sort((a,b)=>{
  const rank=f=>
   f.format==='ean_13'?0:
   f.format==='ean_8'?1:
   f.format==='upc_a'?2:
   f.format==='upc_e'?3:4;

  return rank(a)-rank(b);
 });

 return list.length?{
  code:String(list[0].rawValue).trim(),
  format:String(list[0].format||'')
 }:null;
}

function markNoBarcode(){
 if(awaitingConfirmation)return;
 clearFrames++;
 // Require the previous barcode to leave the camera view before allowing
 // that exact same barcode to be scanned again.
 if(clearFrames>=8){
  lastSentCode='';
  candidateCode='';
  candidateFormat='';
  candidateFrames=0;
 }
}

function acceptCandidate(code,format){

 code=String(code||'').trim();
 format=String(format||'').toLowerCase();

 if(!code||awaitingConfirmation)return;

 if(['ean_13','ean_8','upc_a'].includes(format)&&!validGtin(code,format)){
  candidateCode='';
  candidateFormat='';
  candidateFrames=0;
  return;
 }

 if(!['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf'].includes(format)){
  return;
 }

 if(code===lastSentCode)return;
 clearFrames=0;
 if(code===candidateCode&&format===candidateFormat){
  candidateFrames++;
 }else{
  candidateCode=code;
  candidateFormat=format;
  candidateFrames=1;
 }

 const required=['ean_13','ean_8','upc_a'].includes(format)?3:4;

 if(candidateFrames>=required&&code!==lastSentCode&&!sending){
  send(code);
 }
}

function zxingFormatName(result){
 try{
  const raw=result.getBarcodeFormat();
  const formats=window.ZXingBrowser&&window.ZXingBrowser.BarcodeFormat;

  return formats&&formats[raw]
   ?String(formats[raw]).toLowerCase()
   :String(raw).toLowerCase();

 }catch(e){
  return '';
 }
}

async function startZXingFallback(){

 const Z=window.ZXingBrowser;

 if(!Z||!Z.BrowserMultiFormatReader){
  message('Safari barcode engine did not load. Check your Internet connection, then reload this page.');
  return;
 }

 try{

  const hints=new Map();

  if(Z.DecodeHintType&&Z.BarcodeFormat){

   hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[
    Z.BarcodeFormat.EAN_13,
    Z.BarcodeFormat.EAN_8,
    Z.BarcodeFormat.UPC_A,
    Z.BarcodeFormat.UPC_E,
    Z.BarcodeFormat.CODE_128,
    Z.BarcodeFormat.CODE_39,
    Z.BarcodeFormat.ITF
   ].filter(x=>x!==undefined));

   if(Z.DecodeHintType.TRY_HARDER){
    hints.set(Z.DecodeHintType.TRY_HARDER,true);
   }
  }

  const reader=new Z.BrowserMultiFormatReader(hints);

  message('Starting Safari barcode camera…');

  // ZXing owns camera access and performs continuous decoding.
  // Do not create another getUserMedia stream here.

  await reader.decodeFromVideoDevice(
   undefined,
   video,
   (result,error,controls)=>{

    if(controls){
     zxingControls=controls;
    }

    if(result){

     clearFrames=0;
     const code=result.getText();
     const format=zxingFormatName(result);

     if(format){
      acceptCandidate(code,format);
     }
     else if(/^\d{13}$/.test(code)&&validGtin(code,'ean_13')){
      acceptCandidate(code,'ean_13');
     }
     else if(/^\d{8}$/.test(code)&&validGtin(code,'ean_8')){
      acceptCandidate(code,'ean_8');
     }
     else if(/^\d{12}$/.test(code)&&validGtin(code,'upc_a')){
      acceptCandidate(code,'upc_a');
     }
    }else if(error){
     const errName=String(error.name||'');
     if(errName==='NotFoundException'||/not found/i.test(String(error.message||''))){
      markNoBarcode();
     }
    }
   }
  );

  cameraActive=true;

  message('Camera active. Scan multiple products one after another. Wait for PC confirmation, then show the next barcode.');

  pollReceipts();

 }catch(e){

  cameraActive=false;

  message(
   'Safari could not start the barcode reader: '+
   ((e&&e.message)||'Camera initialization failed')+
   '. Tap Start / Retry camera.'
  );
 }
}

async function send(code){

 code=String(code||'').trim();

 if(!code||sending||awaitingConfirmation||code===lastSentCode)return false;

 if(!validEndpoint||!validToken){
  message('Invalid pairing link. Start Phone Scan again from Majorelle on your PC.');
  return false;
 }

 sending=true;
 awaitingConfirmation=true;
 clearFrames=0;
 if(confirmationTimer)clearTimeout(confirmationTimer);
 confirmationTimer=setTimeout(()=>{
  if(awaitingConfirmation){
   awaitingConfirmation=false;
   message('No confirmation received yet. Check the PC, then scan the next product.');
  }
 },20000);

 message('Barcode '+code+' sent. Waiting for PC verification…');

 try{

  const result=await jsonp('submit',{code});

  if(result.error)throw new Error(result.error);

  lastSentCode=code;

  candidateCode='';
  candidateFormat='';
  candidateFrames=0;

  message('Barcode '+code+' sent. Waiting for Majorelle to confirm the product…');

  try{
   if(navigator.vibrate)navigator.vibrate(70);
  }catch(e){}

  return true;

 }catch(e){

  awaitingConfirmation=false;
  if(confirmationTimer)clearTimeout(confirmationTimer);
  confirmationTimer=null;
  candidateCode='';
  candidateFrames=0;

  message((e&&e.message)||'Could not send barcode. Try again.');

  return false;

 }finally{
  sending=false;
 }
}

async function pollReceipts(){

 if(!cameraActive||receiptBusy)return;

 receiptBusy=true;

 try{

  const result=await jsonp('poll');

  if(result&&result.receipt){

   const r=result.receipt;
   awaitingConfirmation=false;
   if(confirmationTimer)clearTimeout(confirmationTimer);
   confirmationTimer=null;
   clearFrames=0;

   if(r.added){

    message('✓ Product added and confirmed on PC. Scan the next product barcode now. Keep this camera page open.');

    try{
     if(navigator.vibrate)navigator.vibrate([60,40,60]);
    }catch(e){}

   }else{

    message('⚠ Barcode '+r.code+' was not found. Check the product on your PC, then scan another barcode. Keep this camera page open.');

    try{
     if(navigator.vibrate)navigator.vibrate([120,70,120]);
    }catch(e){}
   }
  }

 }catch(e){}

 finally{

  receiptBusy=false;

  if(cameraActive){
   receiptTimer=setTimeout(pollReceipts,900);
  }
 }
}

async function start(){

 stop();

 sending=false;
 awaitingConfirmation=false;
 if(confirmationTimer)clearTimeout(confirmationTimer);
 confirmationTimer=null;
 clearFrames=0;
 candidateCode='';
 candidateFormat='';
 candidateFrames=0;
 lastSentCode='';

 if(!validEndpoint||!validToken){
  message('Invalid pairing link. Start Phone Scan again from Majorelle on your PC.');
  return;
 }

 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
  message('Camera API unavailable. Open this HTTPS page in Safari or Chrome.');
  return;
 }

 const isSafari=
  /Safari/i.test(navigator.userAgent)&&
  !/Chrome|CriOS|Edg|OPR|FxiOS/i.test(navigator.userAgent);

 // Safari/iOS uses ZXing to acquire and scan the camera.
 if(isSafari||!('BarcodeDetector' in window)){
  await startZXingFallback();
  return;
 }

 try{

  message('Requesting camera access…');

  stream=await navigator.mediaDevices.getUserMedia({
   audio:false,
   video:{
    facingMode:{ideal:'environment'},
    width:{ideal:1920},
    height:{ideal:1080}
   }
  });

  video.srcObject=stream;
  await video.play();

  cameraActive=true;

  pollReceipts();

  let supported=[];

  try{
   supported=await BarcodeDetector.getSupportedFormats();
  }catch(e){}

  const formats=[
   'ean_13','ean_8','upc_a','upc_e',
   'code_128','code_39','itf'
  ].filter(x=>supported.includes(x));

  if(!formats.length){

   stop();

   await startZXingFallback();

   return;
  }

  detector=new BarcodeDetector({formats});

  message('Camera active. Scan multiple products one after another. Wait for PC confirmation, then show the next barcode.');

  async function scan(){

   if(!cameraActive)return;

   if(!detectorBusy&&video.readyState>=2){

    detectorBusy=true;

    let hits=[];

    try{
     hits=await detector.detect(video);
    }catch(e){}

    detectorBusy=false;

    const found=candidateFrom(hits);

    if(found){
     acceptCandidate(found.code,found.format);
    }else{
     markNoBarcode();
    }
   }

   if(cameraActive){
    raf=requestAnimationFrame(scan);
   }
  }

  raf=requestAnimationFrame(scan);

 }catch(e){

  cameraActive=false;

  const name=e&&e.name||'';

  if(name==='NotAllowedError'||name==='PermissionDeniedError'){
   message('Camera permission was denied. Check Safari website camera permissions and reload.');
  }
  else if(name==='NotFoundError'){
   message('No camera was found on this device.');
  }
  else{
   message('Could not start camera: '+((e&&e.message)||name||'unknown error'));
  }
 }
}

document.getElementById('start').addEventListener('click',start);

document.getElementById('stop').addEventListener('click',()=>{
 stop();
 message('Camera stopped.');
});

document.getElementById('send').addEventListener('click',async()=>{
 const field=document.getElementById('manual');

 if(await send(field.value)){
  field.value='';
 }
});

document.getElementById('manual').addEventListener('keydown',async e=>{
 if(e.key==='Enter'){
  e.preventDefault();

  if(await send(e.target.value)){
   e.target.value='';
  }
 }
});

if(validEndpoint&&validToken){
 start();
}else{
 message('Invalid pairing link. Start Phone Scan again from Majorelle on your PC.');
}

})();
</script>
</body>
</html>
